name: Publish report

# Builds a static snapshot of the Jira report(s) and publishes it to GitHub
# Pages. No server, no login: the team just opens the Pages link.
on:
  schedule:
    # UTC. ~07:45-17:45 Tehran, Saturday-Wednesday. Edit freely.
    - cron: '15 4-14 * * 6,0,1,2,3'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
      PROJECTS: ${{ vars.PROJECTS }}
      REPORT_PASSWORD: ${{ secrets.REPORT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Pages on a public repo is open to the whole internet. Never publish
      # plain-text Jira data there: require the encryption password.
      - name: Refuse to publish unencrypted data from a public repo
        if: ${{ github.repository_visibility == 'public' && env.REPORT_PASSWORD == '' }}
        run: |
          echo "::error::The repo is public, so Pages is public. Set the REPORT_PASSWORD secret (the page is then encrypted) or make the repo private."
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Keeps history.json between runs so the report can show "since yesterday".
      - name: Restore trend history
        uses: actions/cache@v4
        with:
          path: .data
          key: history-${{ github.run_id }}
          restore-keys: history-

      - name: Build pages from Jira
        env:
          DATA_DIR: .data
          OUT_DIR: dist
        run: node scripts/build-static.js

      - name: Encrypt pages with the team password
        if: ${{ env.REPORT_PASSWORD != '' }}
        run: |
          npx -y staticrypt@3 dist/*.html -p "$REPORT_PASSWORD" -d dist-encrypted --short --remember 30 \
            --template-title "ردیاب Jira" \
            --template-instructions "برای دیدن گزارش، رمز تیم رو وارد کن." \
            --template-placeholder "رمز" \
            --template-button "ورود"
          rm -rf dist
          mv dist-encrypted dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
